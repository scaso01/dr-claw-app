name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The build reads secrets.properties when present and falls back to empty
      # values when it is not. Copying the example proves the documented setup
      # path actually produces a build, which is the thing an outsider follows.
      - name: seed secrets from the example
        run: cp secrets.properties.example secrets.properties

      - name: assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: unit tests
        run: ./gradlew test --console=plain

      - name: upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
